<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48" viewBox="0 0 64 48">
  <!-- Extremely tiny 2x3 board (2 rows, 3 columns) with a four-tile
       S-shaped polyomino marked in green (see GitHub issue #50). Cell
       size is 20x20, board is inset by 2px on all sides. -->
  <rect width="64" height="48" rx="10" fill="#1b1030"/>
  <!-- Empty cells -->
  <rect x="2" y="4" width="20" height="20" fill="#2c1c4a"/>
  <rect x="42" y="24" width="20" height="20" fill="#2c1c4a"/>
  <!-- S-tetromino cells, marked green -->
  <rect x="22" y="4" width="20" height="20" fill="#35c46a"/>
  <rect x="42" y="4" width="20" height="20" fill="#35c46a"/>
  <rect x="2" y="24" width="20" height="20" fill="#35c46a"/>
  <rect x="22" y="24" width="20" height="20" fill="#35c46a"/>
  <!-- Grid lines -->
  <g stroke="#1b1030" stroke-width="2">
    <line x1="22" y1="4" x2="22" y2="44"/>
    <line x1="42" y1="4" x2="42" y2="44"/>
    <line x1="2" y1="24" x2="62" y2="24"/>
  </g>
  <rect x="2" y="4" width="60" height="40" fill="none" stroke="#1b1030" stroke-width="2"/>
</svg>
