<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Einkreis</title>
  </head>
  <body>
    <div id="app">
      <!--
        Shared animated postgame-loop background canvas. It sits behind every
        `.screen` layer (first child of #app, painted first) but is only
        actually visible through the screens that opt in via
        `.menuBgScreen` (mainMenu/freePlay/newGame — every *fixed-size* menu)
        making their own background transparent; the Resume/Replays lists and
        the game screen itself keep an opaque background and simply cover it.
        `main.ts`'s `showScreen` starts/stops the `requestAnimationFrame` loop
        driving it whenever navigation crosses in or out of that screen set,
        not on every individual screen change, so it keeps animating
        uninterrupted while moving between e.g. Free Play and New Game.
      -->
      <canvas id="menuCanvas"></canvas>

      <!-- Main menu: animated postgame-loop background behind Blitz/Free Play. -->
      <div id="mainMenuScreen" class="screen menuBgScreen">
        <div class="menuContent mainMenuContent">
          <h1 class="menuTitle">Einkreis</h1>
          <p class="menuTagline">Trace one loop through every cell.</p>
          <div class="menuButtonStack">
            <button class="menuBtn menuBtnPrimary" id="freePlayEntryBtn">Free Play</button>
            <button class="menuBtn menuBtnSecondary" id="blitzEntryBtn">Blitz</button>
            <button class="menuBtn menuBtnSecondary" id="settingsEntryBtn">Settings</button>
          </div>
        </div>
      </div>

      <!-- Settings: adjust sfx volume (persisted locally, see src/settings.ts). -->
      <div id="settingsScreen" class="screen menuBgScreen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="settingsBackBtn">‹ Menu</button>
          <h2>Settings</h2>
        </div>
        <div class="menuContent newGameForm">
          <label class="volumeLabel"
            >Sound effects volume
            <span class="volumeRow">
              <input type="range" id="sfxVolumeSlider" min="0" max="100" value="60" step="1" />
              <span id="sfxVolumeReadout">60%</span>
            </span>
          </label>
          <button class="secondary" id="sfxVolumePreviewBtn">🔊 Preview</button>
        </div>
      </div>

      <!-- Blitz hub: Play / Leaderboard. -->
      <div id="blitzMenuScreen" class="screen menuBgScreen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="blitzMenuBackBtn">‹ Menu</button>
          <h2>Blitz</h2>
        </div>
        <div class="menuContent">
          <div class="menuButtonStack">
            <button class="menuBtn menuBtnPrimary" id="blitzPlayEntryBtn">Play</button>
            <button class="menuBtn menuBtnSecondary" id="blitzLeaderboardEntryBtn">Leaderboard</button>
          </div>
        </div>
      </div>

      <!-- Blitz setup: pick a pace preset, then start a fresh, randomly-seeded run. -->
      <div id="blitzSetupScreen" class="screen menuBgScreen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="blitzSetupBackBtn">‹ Blitz</button>
          <h2>New Run</h2>
        </div>
        <div class="menuContent newGameForm">
          <label
            >Pace
            <select id="blitzPaceSelect">
              <option value="slow">Slow (90s start, +0.2s/edge)</option>
              <option value="normal" selected>Normal (60s start, +0.15s/edge)</option>
              <option value="fast">Fast (45s start, +0.1s/edge)</option>
            </select>
          </label>
          <button class="menuBtn menuBtnPrimary" id="blitzStartBtn">Start</button>
        </div>
      </div>

      <!-- Blitz leaderboard: every difficulty setting the player has completed a run at. -->
      <div id="blitzLeaderboardScreen" class="screen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="blitzLeaderboardBackBtn">‹ Blitz</button>
          <h2>Leaderboard</h2>
        </div>
        <div id="blitzLeaderboardListEl" class="listScroll"></div>
      </div>

      <!-- Blitz leaderboard runs: every run recorded at one specific difficulty, sorted by score. -->
      <div id="blitzLeaderboardRunsScreen" class="screen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="blitzLeaderboardRunsBackBtn">‹ Leaderboard</button>
          <h2 id="blitzLeaderboardRunsTitle">Runs</h2>
        </div>
        <div id="blitzLeaderboardRunsListEl" class="listScroll"></div>
      </div>

      <!-- Blitz game over: final score + Play Again / back to Blitz menu. -->
      <div id="blitzGameOverScreen" class="screen menuBgScreen hidden">
        <div class="menuContent">
          <h1 class="menuTitle">Time's up!</h1>
          <p class="menuTagline" id="blitzGameOverScore"></p>
          <div class="menuButtonStack">
            <button class="menuBtn menuBtnPrimary" id="blitzPlayAgainBtn">Play Again</button>
            <button class="menuBtn menuBtnSecondary" id="blitzGameOverReplayBtn">Watch Replay</button>
            <button class="menuBtn menuBtnSecondary" id="blitzGameOverMenuBtn">‹ Blitz Menu</button>
          </div>
        </div>
      </div>

      <!-- Free Play hub: New Game / Resume / Replays. -->
      <div id="freePlayMenuScreen" class="screen menuBgScreen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="freePlayBackBtn">‹ Menu</button>
          <h2>Free Play</h2>
        </div>
        <div class="menuContent">
          <div class="menuButtonStack">
            <button class="menuBtn menuBtnPrimary" id="newGameEntryBtn">New Game</button>
            <button class="menuBtn menuBtnSecondary" id="resumeEntryBtn">Resume</button>
            <button class="menuBtn menuBtnSecondary" id="replaysEntryBtn">Replays</button>
          </div>
        </div>
      </div>

      <!-- New Game: pick size + shape, then start a fresh, randomly-seeded puzzle. -->
      <div id="newGameMenuScreen" class="screen menuBgScreen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="newGameBackBtn">‹ Free Play</button>
          <h2>New Game</h2>
        </div>
        <div class="menuContent newGameForm">
          <label
            >Size
            <select id="newGameSizeSelect">
              <option value="tiny">Tiny</option>
              <option value="mini">Mini</option>
              <option value="small" selected>Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
              <option value="huge">Huge</option>
            </select>
          </label>
          <label
            >Shape
            <select id="newGameShapeSelect">
              <option value="rect" selected>Rectangle</option>
              <option value="random">Random shape</option>
              <option value="toroidal">Toroidal</option>
              <!--
                Klein bottle / projective plane are temporarily disabled — their
                nonorientable-surface generation has known bugs that are too hard
                to fix for now (src/game/topology.ts's file doc comment). The
                underlying code (buildKleinBottlePuzzle/buildProjectivePlanePuzzle
                etc.) is still there for a future fix; these options are just not
                offered to players meanwhile.
              -->
            </select>
          </label>
          <button class="menuBtn menuBtnPrimary" id="newGameStartBtn">Start</button>
        </div>
      </div>

      <!-- Resume: every saved in-progress game, resumable or deletable. -->
      <div id="resumeMenuScreen" class="screen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="resumeBackBtn">‹ Free Play</button>
          <h2>Resume</h2>
        </div>
        <div id="resumeListEl" class="listScroll"></div>
      </div>

      <!-- Replays: every completed puzzle, reviewable or deletable. -->
      <div id="replaysMenuScreen" class="screen hidden">
        <div class="menuHeader">
          <button class="secondary backBtn" id="replaysBackBtn">‹ Free Play</button>
          <h2>Replays</h2>
        </div>
        <div id="replaysListEl" class="listScroll"></div>
      </div>

      <!--
        The live/reviewed/Blitz game itself — one shared canvas + board
        layout for all three (`main.ts`'s `mode: 'playing' | 'reviewing' |
        'blitz' | 'blitzReplay'`). `#exitBtn`/`#headerInfo`/`#playControls`
        are Free Play's own; `#reviewBar` is the ordinary per-puzzle review
        overlay; `#blitzExitBtn`/`#blitzHeaderInfo`/`#blitzBar` are Blitz's
        live-run equivalents, and `#blitzReplayBar` is a Blitz *run's*
        real-time replay (distinct from `#reviewBar`'s single-puzzle replay)
        — exactly one of these sets is ever visible, toggled by `main.ts`'s
        `mode`.
      -->
      <div id="gameScreen" class="screen hidden">
        <header>
          <button class="secondary backBtn" id="exitBtn">‹ Exit</button>
          <button class="secondary backBtn hidden" id="blitzExitBtn">‹ Forfeit</button>
          <h1>Einkreis</h1>
          <div id="headerInfo">
            <div id="puzzleLabel"></div>
            <div id="progress">0 / 0</div>
          </div>
          <div id="blitzHeaderInfo" class="hidden">
            <div id="blitzTimer">0:00</div>
            <div id="blitzStats"></div>
          </div>
        </header>
        <div id="boardWrap">
          <canvas id="canvas"></canvas>
          <div class="zoomControls">
            <button id="zoomInBtn">+</button>
            <button id="zoomOutBtn">–</button>
            <button id="zoomFitBtn" style="font-size: 0.65rem">Fit</button>
          </div>
          <div id="winBanner">Loop complete!</div>
          <div id="toast"></div>
          <div id="reviewBar" class="hidden">
            <div id="reviewIdleControls">
              <button class="secondary backBtn" id="exitReviewBtn">‹ Done</button>
              <span id="reviewLabel"></span>
              <button class="secondary" id="replayBtn">Replay</button>
            </div>
            <div id="reviewPlaybackControls" class="hidden">
              <button class="secondary backBtn" id="replayCloseBtn">‹ Done</button>
              <button class="secondary" id="replayPlayPauseBtn">Pause</button>
              <select id="replaySpeedSelect" title="Replay speed">
                <option value="0.25">0.25×</option>
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
              </select>
              <input type="range" id="replayScrubber" min="0" max="0" value="0" step="1" />
              <span id="replayCounter"></span>
            </div>
          </div>
          <!-- Blitz run replay: plays the whole recorded run back at real pace (see game/blitz.ts's BlitzEvent). Distinct from #reviewBar, which replays one puzzle's move log. -->
          <div id="blitzReplayBar" class="hidden">
            <button class="secondary backBtn" id="blitzReplayCloseBtn">‹ Close</button>
            <button class="secondary" id="blitzReplayPlayPauseBtn">Pause</button>
            <select id="blitzReplaySpeedSelect" title="Replay speed">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
            <input type="range" id="blitzReplayScrubber" min="0" max="0" value="0" step="1" />
            <span id="blitzReplayCounter"></span>
          </div>
        </div>
        <div class="controls" id="playControls">
          <div id="activeControls" class="controlGroup">
            <button class="secondary" id="undoBtn" disabled>Undo</button>
            <button class="secondary" id="redoBtn" disabled>Redo</button>
            <button class="secondary" id="giveUpBtn" disabled>Give Up</button>
          </div>
          <div id="completeControls" class="controlGroup hidden">
            <button id="rematchBtn">Rematch</button>
            <button class="secondary" id="viewReplayBtn">Replay</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
