<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Loop It</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Loop It</h1>
        <div id="headerInfo">
          <div id="puzzleLabel"></div>
          <div id="progress">0 / 0</div>
        </div>
      </header>
      <div id="boardWrap">
        <canvas id="canvas"></canvas>
        <div class="zoomControls">
          <button id="zoomInBtn">+</button>
          <button id="zoomOutBtn">–</button>
          <button id="zoomFitBtn" style="font-size: 0.65rem">Fit</button>
        </div>
        <div id="winBanner">Loop complete!</div>
        <div id="toast"></div>
        <div id="reviewBar" class="hidden">
          <span id="reviewLabel"></span>
          <div id="reviewIdleControls">
            <button class="secondary" id="replayBtn">Replay</button>
            <button class="secondary" id="exitReviewBtn">Done</button>
          </div>
          <div id="reviewPlaybackControls" class="hidden">
            <button class="secondary" id="replayPlayPauseBtn">Pause</button>
            <input type="range" id="replayScrubber" min="0" max="0" value="0" step="1" />
            <span id="replayCounter"></span>
            <button class="secondary" id="replayCloseBtn">Done</button>
          </div>
        </div>
      </div>
      <div class="controls" id="playControls">
        <label
          >Size
          <select id="sizeSelect">
            <option value="tiny">Tiny</option>
            <option value="mini">Mini</option>
            <option value="small" selected>Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
            <option value="huge">Huge</option>
          </select>
        </label>
        <label
          >Shape
          <select id="shapeSelect">
            <option value="rect" selected>Rectangle</option>
            <option value="random">Random shape</option>
            <option value="toroidal">Toroidal</option>
            <option value="klein">Klein bottle</option>
            <option value="projective">Projective plane</option>
          </select>
        </label>
        <label
          >Collections
          <div class="collectionsInputs">
            <input type="number" id="maxCollectionsInput" min="0" max="6" step="1" value="0" title="Max number of edge collections (0 = off)" />
            <input type="number" id="minCollectionSizeInput" min="2" max="8" step="1" value="2" title="Minimum edges per collection" />
            <input type="number" id="maxCollectionSizeInput" min="2" max="8" step="1" value="4" title="Maximum edges per collection" />
          </div>
        </label>
        <button class="secondary" id="resetBtn">Reset</button>
        <button class="secondary" id="undoBtn" disabled>Undo</button>
        <button class="secondary" id="redoBtn" disabled>Redo</button>
        <button class="secondary" id="giveUpBtn" disabled>Give Up</button>
        <button class="secondary" id="historyBtn">History</button>
        <button id="nextBtn" disabled>Next Puzzle</button>
      </div>
    </div>
    <div id="historyOverlay" class="hidden">
      <div class="overlayHeader">
        <h2>Completed Puzzles</h2>
        <button class="secondary" id="closeHistoryBtn">Close</button>
      </div>
      <div id="historyList"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
