<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Loop It</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Loop It</h1>
        <div id="headerInfo">
          <div id="puzzleLabel"></div>
          <div id="progress">0 / 0</div>
        </div>
      </header>
      <div id="boardWrap">
        <canvas id="canvas"></canvas>
        <div class="zoomControls">
          <button id="zoomInBtn">+</button>
          <button id="zoomOutBtn">–</button>
          <button id="zoomFitBtn" style="font-size: 0.65rem">Fit</button>
        </div>
        <div id="winBanner">Loop complete!</div>
        <div id="reviewBar" class="hidden">
          <span id="reviewLabel"></span>
          <button class="secondary" id="exitReviewBtn">Done</button>
        </div>
      </div>
      <div class="controls" id="playControls">
        <label
          >Size
          <select id="sizeSelect">
            <option value="tiny">Tiny</option>
            <option value="mini">Mini</option>
            <option value="small" selected>Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
            <option value="huge">Huge</option>
          </select>
        </label>
        <button class="secondary" id="resetBtn">Reset</button>
        <button class="secondary" id="historyBtn">History</button>
        <button id="nextBtn" disabled>Next Puzzle</button>
      </div>
    </div>
    <div id="historyOverlay" class="hidden">
      <div class="overlayHeader">
        <h2>Completed Puzzles</h2>
        <button class="secondary" id="closeHistoryBtn">Close</button>
      </div>
      <div id="historyList"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
